name: Publicar e atualizar metodologia

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '4-59/5 * * * *'

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.enabled.outputs.ready }}
      version: ${{ steps.calendar.outputs.version }}
    steps:
      - name: Verificar se GitHub Pages foi ativado
        id: enabled
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const result = await github.rest.repos.getPages({owner: context.repo.owner, repo: context.repo.repo});
              core.setOutput('ready', result.data.build_type === 'workflow' ? 'true' : 'false');
              if (result.data.build_type !== 'workflow') core.notice('Selecione GitHub Actions em Settings > Pages.');
            } catch (error) {
              if (![403,404].includes(error.status)) throw error;
              core.setOutput('ready', 'false');
              core.notice('Ative GitHub Pages em Settings > Pages; a versão pronta permanece no repositório.');
            }
      - uses: actions/checkout@v6
        if: steps.enabled.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.enabled.outputs.ready == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        if: steps.enabled.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/configure-pages@v5
        if: steps.enabled.outputs.ready == 'true'
        id: pages
      - name: Instalar dependências
        if: steps.enabled.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Ler as quatro abas de metodologia
        id: calendar
        if: steps.enabled.outputs.ready == 'true'
        run: pnpm sync:data
      - name: Validar os dados e a atualização
        if: steps.enabled.outputs.ready == 'true'
        run: pnpm test:sync
      - name: Recuperar a interface compilada desta versão
        if: steps.enabled.outputs.ready == 'true'
        uses: actions/cache@v4
        id: interface
        with:
          path: out
          key: pages-${{ runner.os }}-${{ github.sha }}-${{ steps.calendar.outputs.version }}-${{ steps.pages.outputs.base_path }}
      - name: Gerar o site estático
        if: steps.enabled.outputs.ready == 'true' && steps.interface.outputs.cache-hit != 'true'
        run: pnpm build:github
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Aplicar os dados atualizados
        if: steps.enabled.outputs.ready == 'true'
        run: |
          mkdir -p out/data
          cp public/data/calendar.json out/data/calendar.json
      - name: Validar os recursos publicados
        if: steps.enabled.outputs.ready == 'true'
        run: pnpm test:export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v4
        if: steps.enabled.outputs.ready == 'true'
        with:
          path: out
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Confirmar os dados publicados
        uses: actions/github-script@v8
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        with:
          script: |
            const url = new URL('data/calendar.json', process.env.SITE_URL);
            let reason = 'A versão publicada ainda não corresponde à planilha.';
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                url.searchParams.set('verification', String(Date.now()));
                const response = await fetch(url, {cache: 'no-store', signal: AbortSignal.timeout(10000)});
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                if (data.version === process.env.EXPECTED_VERSION && data.events?.length) {
                  core.info(data.events.length + ' registros confirmados no site. Planilha lida em ' + data.fetchedAt + '.');
                  return;
                }
              } catch (error) {
                reason = error.message;
              }
              if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Falha ao confirmar os dados publicados: ' + reason);
